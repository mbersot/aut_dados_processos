version: '3.7'

services:
  redis:
    image: redis:latest
    command: [
        "redis-server",
        "--appendonly",
        "yes",
        "--port",
        "6379"
      ]
    volumes:
      - redis_data:/data
    networks:
      - network_public
    deploy:
      mode: replicated
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M  

  evoai:
    image: 'evoapicloud/evo-ai:latest'
    volumes:
      - 'evoai_data:/evoai/data'
    networks:
      - network_public
    depends_on:
      - redis  # Adicionando dependência ao serviço Redis
    environment:
      - API_TITLE=Evo API
      - API_DESCRIPTION=API para execução de agentes de AI
      - API_VERSION=1.0.0
      - API_URL=https://apievo.sindicodigital.solutions
      - ORGANIZATION_NAME=Evo AI
      - ORGANIZATION_URL=https://apievo.sindicodigital.solutions
      - POSTGRES_CONNECTION_STRING=postgresql://postgres:Mfcd62!!Mfcd62!!@postgresevoai:5432/evoai
      - REDIS_HOST=redis  # Configurando o host do Redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=false
      - REDIS_KEY_PREFIX=evoai
      - REDIS_TTL=3600
      - TOOL_CACHE_TTL=3600
      - JWT_SECRET_KEY=b5a0c99155b3fdcc60d459859903724a
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_TIME=3600
      - ENCRYPTION_KEY="2Xq5fe2pvOeZ4lr5HRH1t1ywn9JolA3vafxTIvCRg9k="
      - SECRET_KEY="2Xq5fe2pvOeZ4lr5HRH1t1ywn9JolA3vafxTIvCRg9k="
      - PYTHONPATH=/app/src
      - LOG_LEVEL=ERROR
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - ADMIN_EMAIL=marcusbersot@gmail.com
      - ADMIN_INITIAL_PASSWORD=Admin@123
      - DEMO_EMAIL=bersotmarcus@gmail.com
      - DEMO_PASSWORD=Demo@123
      - DEMO_CLIENT=DemoClient
      - EMAIL_PROVIDER=smtp
      - SMTP_HOST=smtp.gmail.com
      - SMTP_FROM=marcusbersot@gmail.com
      - SMTP_USER=marcusbersot@gmail.com
      - SMTP_PASSWORD=qwceywuxduqurmsg
      - SMTP_PORT=587
      - SMTP_USE_TLS=true
      - SMTP_USE_SSL=false
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.evoai.rule=Host(`apievo.sindicodigital.solutions`)
        - traefik.http.services.evoai.loadbalancer.server.port=8000
        - traefik.http.routers.evoai.service=evoai
        - traefik.http.routers.evoai.tls.certresolver=letsencryptresolver
        - traefik.http.routers.evoai.entrypoints=websecure
        - traefik.http.routers.evoai.tls=true

  evoaifront:
    image: 'evoapicloud/evo-ai-frontend:latest'
    networks:
      - network_public
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=https://apievo.sindicodigital.solutions
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.evoaifront.rule=Host(`evoaifront.sindicodigital.solutions`)
        - traefik.http.services.evoaifront.loadbalancer.server.port=3000
        - traefik.http.routers.evoaifront.service=evoaifront
        - traefik.http.routers.evoaifront.tls.certresolver=letsencryptresolver
        - traefik.http.routers.evoaifront.entrypoints=websecure
        - traefik.http.routers.evoaifront.tls=true

  postgresevoai:
    image: 'pgvector/pgvector:pg14'
    environment:
      - POSTGRES_PASSWORD=Mfcd62!!Mfcd62!!
      - POSTGRES_DB=evoai
      - TZ=America/Sao_Paulo
    networks:
      - network_public
    volumes:
      - 'postgres_dataevoai:/var/lib/postgresql/data'
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1'
          memory: 3072M

volumes:
  redis_data:
    external: true
    name: redis_data 
  evoai_data:
    driver: local
  postgres_dataevoai:
    driver: local

networks:
  network_public:
    external: true
    name: network_public